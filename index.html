<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIVIA.AI - Acceso</title>
    <style>
        /* Mismos estilos bonitos de antes... */
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { background-color: #ff4b4b; color: white; padding: 15px 30px; border: none; border-radius: 50px; font-size: 1.2rem; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background-color: #d43b3b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧬 Ingreso a KIVIA</h1>
        <p>Completa tus datos para personalizar tu asistente.</p>

        <input type="text" id="nombre" placeholder="Tu Nombre" required>
        
        <select id="rol">
            <option value="Paciente">Paciente / Adulto Mayor</option>
            <option value="Cuidador">Cuidador / Familiar</option>
            <option value="Medico">Personal Médico</option>
        </select>

        <input type="text" id="ubicacion" placeholder="Tu Ciudad (Ej: Bogotá)" required>

        <button onclick="irALaApp()" class="btn">🚀 ENTRAR AL CHAT</button>
    </div>

    <script>
        function irALaApp() {
            // 1. Capturamos los datos
            var nombre = document.getElementById('nombre').value;
            var rol = document.getElementById('rol').value;
            var ubicacion = document.getElementById('ubicacion').value;

            // 2. Validación simple
            if(nombre === "" || ubicacion === "") {
                alert("Por favor, escribe tu nombre y ciudad.");
                return;
            }

            // 3. Construimos la URL con los datos "en los vagones"
            // encodeURIComponent sirve para arreglar espacios y tildes
            var urlBase = "https://asistente-chatbotv4.streamlit.app/";
            var urlFinal = urlBase + "?nombre=" + encodeURIComponent(nombre) + 
                           "&rol=" + encodeURIComponent(rol) + 
                           "&ubicacion=" + encodeURIComponent(ubicacion);

            // 4. Enviamos al usuario
            window.location.href = urlFinal;
        }
    </script>

</body>
</html>
