<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIVIA.AI - Configuración de Perfil</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 0.9rem; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; /* Importante para que no se salga */
        }
        .btn {
            background-color: #ff4b4b;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #d43b3b; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>🧬 KIVIA.AI</h1>
        <p>Ingresa tus datos clínicos para personalizar la asistencia.</p>

        <div class="input-group">
            <label>Nombre del Paciente</label>
            <input type="text" id="nombre" placeholder="Ej: María Pérez">
        </div>

        <div class="input-group">
            <label>Edad</label>
            <input type="number" id="edad" placeholder="Ej: 75">
        </div>

        <div class="input-group">
            <label>Peso (kg)</label>
            <input type="text" id="peso" placeholder="Ej: 70kg">
        </div>

        <div class="input-group">
            <label>Condición Médica Principal</label>
            <input type="text" id="condicion" placeholder="Ej: Diabetes Tipo 2, Hipertensión...">
        </div>

        <button onclick="conectarConApp()" class="btn">INICIAR ASISTENTE 🚀</button>
    </div>

    <script>
        function conectarConApp() {
            // 1. Obtener valores
            const nombre = document.getElementById('nombre').value;
            const edad = document.getElementById('edad').value;
            const peso = document.getElementById('peso').value;
            const condicion = document.getElementById('condicion').value;

            // 2. Validar (al menos el nombre)
            if (!nombre) {
                alert("Por favor, ingresa al menos el nombre.");
                return;
            }

            // 3. Crear URL mágica
            // Usamos encodeURIComponent para que los espacios y tildes no rompan el link
            const baseUrl = "https://asistente-chatbotv4.streamlit.app/";
            const params = `?nombre=${encodeURIComponent(nombre)}&edad=${encodeURIComponent(edad)}&peso=${encodeURIComponent(peso)}&condicion=${encodeURIComponent(condicion)}`;
            
            // 4. Redirigir
            window.location.href = baseUrl + params;
        }
    </script>

</body>
</html>
